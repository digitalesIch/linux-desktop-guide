<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#06100b" />
		<title>Offline — Linux Desktop Guide</title>
		<style>
			:root {
				color-scheme: light dark;
				--paper: #f4f0e7;
				--ink: #292d29;
				--muted: #5c6059;
				--lime: #c6ff3d;
				--dark: #06100b;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: var(--paper);
				color: var(--ink);
				font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			main {
				width: min(32rem, calc(100% - 3rem));
				padding: 2rem 0;
			}
			.badge {
				display: inline-block;
				padding: 0.4rem 0.7rem;
				border-radius: 999px;
				background: var(--dark);
				color: var(--lime);
				font-size: 0.72rem;
				font-weight: 700;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}
			h1 {
				margin: 1.2rem 0 0.8rem;
				font-size: clamp(2rem, 8vw, 3.4rem);
				line-height: 1;
				letter-spacing: -0.04em;
			}
			p {
				margin: 0 0 1rem;
				color: var(--muted);
				font-size: 1.05rem;
				line-height: 1.55;
			}
			a {
				display: inline-block;
				margin-top: 0.6rem;
				padding: 0.8rem 1rem;
				border-radius: 0.5rem;
				background: var(--dark);
				color: var(--lime);
				font-weight: 700;
				text-decoration: none;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: var(--dark);
					color: var(--paper);
				}
				p {
					color: #c7cdc2;
				}
				a {
					background: var(--lime);
					color: var(--dark);
				}
			}
		</style>
	</head>
	<body>
		<main>
			<span class="badge">Linux Desktop Guide</span>
			<h1>You are offline.</h1>
			<p>
				This page is not in the offline cache yet. Pages you have already visited remain available,
				and the guide will work normally when the connection returns.
			</p>
			<a href="/">Back to the guide</a>
		</main>
	</body>
</html>
