<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#faf9f6" />
		<title>Offline — Linux Desktop Guide</title>
		<style>
			:root {
				color-scheme: light dark;
				--paper: #faf9f6;
				--surface: #ffffff;
				--ink: #111318;
				--muted: #4b5058;
				--line: rgba(17, 19, 24, 0.12);
				--violet: #6d28d9;
				--spectrum: linear-gradient(
					110deg,
					#ff5c8a,
					#ffb547,
					#b8f23d,
					#38d9ff,
					#8b5cf6
				);
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background-color: var(--paper);
				background-image:
					radial-gradient(ellipse 50% 35% at 8% 0%, rgba(255, 92, 138, 0.1), transparent 70%),
					radial-gradient(ellipse 45% 30% at 92% 0%, rgba(56, 217, 255, 0.09), transparent 70%);
				background-repeat: no-repeat;
				color: var(--ink);
				font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			main {
				width: min(32rem, calc(100% - 3rem));
				padding: 2rem 0;
			}
			.badge {
				display: inline-block;
				padding: 0.4rem 0.7rem;
				border: 1px solid transparent;
				border-radius: 999px;
				background:
					linear-gradient(var(--ink), var(--ink)) padding-box,
					var(--spectrum) border-box;
				color: var(--paper);
				font-size: 0.72rem;
				font-weight: 700;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}
			h1 {
				margin: 1.2rem 0 0.8rem;
				font-size: clamp(2rem, 8vw, 3.4rem);
				line-height: 1;
				letter-spacing: -0.04em;
			}
			h1::after {
				content: '';
				display: block;
				width: 4rem;
				height: 3px;
				margin-top: 1.1rem;
				border-radius: 3px;
				background: var(--spectrum);
			}
			p {
				margin: 0 0 1rem;
				color: var(--muted);
				font-size: 1.05rem;
				line-height: 1.55;
			}
			a {
				display: inline-block;
				margin-top: 0.6rem;
				padding: 0.8rem 1rem;
				border: 1px solid transparent;
				border-radius: 0.6rem;
				background:
					linear-gradient(var(--ink), var(--ink)) padding-box,
					var(--spectrum) border-box;
				color: var(--paper);
				font-weight: 700;
				text-decoration: none;
				box-shadow: 0 14px 30px -20px color-mix(in srgb, var(--violet) 55%, transparent);
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--paper: #0b0d12;
					--surface: #141821;
					--ink: #f3f5f7;
					--muted: #a7afbc;
					--line: rgba(255, 255, 255, 0.12);
					--violet: #c4b5fd;
				}
				body {
					background-image:
						radial-gradient(ellipse 50% 35% at 8% 0%, rgba(255, 92, 138, 0.14), transparent 70%),
						radial-gradient(ellipse 45% 30% at 92% 0%, rgba(56, 217, 255, 0.12), transparent 70%);
				}
			}
		</style>
	</head>
	<body>
		<main>
			<span class="badge">Linux Desktop Guide</span>
			<h1>You are offline.</h1>
			<p>
				This page is not in the offline cache yet. Pages you have already visited remain available,
				and the guide will work normally when the connection returns.
			</p>
			<a href="./">Back to the guide</a>
		</main>
	</body>
</html>
