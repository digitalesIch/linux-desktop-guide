name: Publish the guide MCP package

on:
  push:
    tags:
      - 'guide-mcp-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-guide-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('tools/guide-mcp/package.json','utf8')).version)")
          test "guide-mcp-v${version}" = "${GITHUB_REF_NAME}"

      - name: Test the package
        run: npm run test:guide-mcp

      - name: Check the package contents
        run: npm run check:guide-package

      - name: Publish with provenance
        working-directory: tools/guide-mcp
        run: npm publish --provenance --access public
