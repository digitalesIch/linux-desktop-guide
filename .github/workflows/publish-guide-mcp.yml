name: Publish the guide MCP package

on:
  push:
    tags:
      - 'guide-mcp-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-guide-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('tools/guide-mcp/package.json','utf8')).version)")
          test "guide-mcp-v${version}" = "${GITHUB_REF_NAME}"

      - name: Test the package
        run: npm run test:guide-mcp

      - name: Check the package contents
        run: npm run check:guide-package

      - name: Publish with provenance
        working-directory: tools/guide-mcp
        run: npm publish --provenance --access public

      - name: Verify the published version
        run: |
          version=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('tools/guide-mcp/package.json','utf8')).version)")
          for attempt in 1 2 3 4 5 6; do
            published=$(npm view "linux-desktop-guide-mcp@${version}" version 2>/dev/null || true)
            if [ "$published" = "$version" ]; then
              echo "Published linux-desktop-guide-mcp@${version}."
              exit 0
            fi
            sleep 5
          done
          echo "::error::linux-desktop-guide-mcp@${version} is not visible on the registry. The trusted publisher may only allow staging; approve the staged version or grant publish permission."
          exit 1
