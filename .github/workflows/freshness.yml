name: Freshness

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: freshness
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check upstream sources
        run: npm run check:freshness -- --json > "$RUNNER_TEMP/freshness.json"

      - name: Open or update the freshness issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/freshness.json`, 'utf8'));
            const problems = [
              ...report.drift.map((item) => ({ kind: 'drift', ...item })),
              ...report.errors.map((item) => ({ kind: 'error', ...item })),
            ];
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner,
              repo,
              labels: 'docs:freshness',
              state: 'open',
              per_page: 10,
            });

            if (problems.length === 0) {
              console.log('No freshness drift.');
              if (open.data.length > 0) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: open.data[0].number,
                  body: `Freshness check on ${report.checkedAt} found no drift. Closing this report.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: open.data[0].number,
                  state: 'closed',
                });
              }
              return;
            }

            const rows = problems
              .map(
                (item) =>
                  `| ${item.kind} | ${item.source} | ${(item.fields ?? []).join(', ')} | ${item.expected ?? ''} | ${item.status ?? ''} |`,
              )
              .join('\n');
            const body = [
              `Freshness check on ${report.checkedAt}.`,
              '',
              '| Kind | Source | Fields | Expected | Status |',
              '| --- | --- | --- | --- | --- |',
              rows,
              '',
              'This issue is updated by the scheduled freshness workflow. It does not edit content.',
            ].join('\n');
            const title = 'Docs freshness: upstream source changed';

            if (open.data.length > 0) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: open.data[0].number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['docs:freshness'],
              });
            }
